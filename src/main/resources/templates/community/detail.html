<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header}"></head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="container my-5">
    <div class="card mb-4">
        <div class="card-header bg-white">
            <h2 class="mb-3" th:text="${post.title}">게시글 제목</h2>
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <span class="badge bg-secondary me-2" th:text="${post.category.name()}">카테고리</span>
                    <span th:if="${post.notice}" class="badge bg-danger me-2">공지</span>
                    <i class="bi bi-person"></i>
                    <span th:text="${post.author.name}">작성자</span>
                    <span class="mx-2">|</span>
                    <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2025-01-01 12:00</span>
                </div>
                <div class="text-muted">
                    <i class="bi bi-eye"></i>
                    <span th:text="${post.viewCount}">0</span>
                    <i class="bi bi-hand-thumbs-up ms-3"></i>
                    <span th:text="${post.likeCount}">0</span>
                </div>
            </div>
        </div>
        <div class="card-body">
            <div style="white-space: pre-wrap;" th:text="${post.content}">
                게시글 내용
            </div>
        </div>
    </div>

    <!-- Comments -->
    <div class="card">
        <div class="card-header bg-white">
            <h5><i class="bi bi-chat-left-text"></i> 댓글 <span th:text="${post.comments.size()}">0</span></h5>
        </div>
        <div class="card-body">
            <div th:if="${post.comments.isEmpty()}" class="text-muted text-center py-3">
                첫 댓글을 작성해보세요!
            </div>
            <div th:each="comment : ${post.comments}" th:if="${!comment.deleted}" class="border-bottom pb-3 mb-3">
                <div class="d-flex justify-content-between mb-2">
                    <strong th:text="${comment.author.name}">작성자</strong>
                    <small class="text-muted" th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}">
                        2025-01-01 12:00
                    </small>
                </div>
                <p class="mb-0" th:text="${comment.content}">댓글 내용</p>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/community}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> 목록으로
        </a>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
