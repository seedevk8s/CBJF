<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header}"></head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="container my-5">
    <h1 class="mb-4">
        <i class="bi bi-box-seam"></i> 상품 목록
    </h1>

    <!-- Search and Filter -->
    <div class="row mb-4">
        <div class="col-md-8">
            <form th:action="@{/courses}" method="get" class="d-flex">
                <input type="text" name="keyword" class="form-control me-2"
                       placeholder="상품 검색..." th:value="${keyword}">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-search"></i> 검색
                </button>
            </form>
        </div>
    </div>

    <!-- Categories -->
    <div class="mb-4">
        <h5 class="mb-3">카테고리</h5>
        <a th:href="@{/courses}" class="category-badge bg-secondary text-white">
            전체
        </a>
        <a th:each="category : ${categories}"
           th:href="@{/courses(categoryId=${category.id})}"
           th:classappend="${selectedCategory != null && selectedCategory.id == category.id} ? 'bg-primary text-white' : 'bg-light text-dark'"
           class="category-badge"
           th:text="${category.name}">
            카테고리
        </a>
    </div>

    <!-- Course List -->
    <div class="row">
        <div class="col-md-4 course-card" th:each="course : ${coursePage.content}">
            <div class="card shadow-sm">
                <img th:src="${course.thumbnailUrl != null ? course.thumbnailUrl : '/images/course-thumbnail-400x200.svg'}"
                     class="card-img-top" th:alt="${course.title}"
                     onerror="this.onerror=null; this.src='/images/course-thumbnail-400x200.svg';">
                <div class="card-body">
                    <span class="badge bg-primary mb-2" th:text="${course.category?.name}">카테고리</span>
                    <span class="badge bg-info mb-2" th:if="${course.level}" th:text="${course.level}">등급</span>
                    <h5 class="card-title" th:text="${course.title}">상품명</h5>
                    <p class="card-text text-muted" th:text="${#strings.abbreviate(course.description, 100)}">
                        상품 설명
                    </p>
                    <div class="mb-2">
                        <small class="text-muted">
                            <i class="bi bi-shop"></i>
                            <span th:text="${course.instructor?.name}">판매자</span>
                        </small>
                        <br>
                        <small class="text-muted" th:if="${course.duration}">
                            <i class="bi bi-truck"></i>
                            <span th:text="${course.duration}">배송</span>
                        </small>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="course-rating">
                            <i class="bi bi-star-fill"></i>
                            <span th:text="${#numbers.formatDecimal(course.rating, 1, 1)}">4.5</span>
                        </span>
                        <span class="text-muted">
                            <i class="bi bi-cart-check"></i>
                            <span th:text="${course.enrollmentCount}">100</span>개 판매
                        </span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="course-price" th:text="${#numbers.formatInteger(course.price, 0, 'COMMA')} + '원'">
                            100,000원
                        </span>
                        <a th:href="@{/courses/{id}(id=${course.id})}" class="btn btn-primary btn-sm">
                            자세히 보기
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Empty State -->
    <div th:if="${coursePage.content.isEmpty()}" class="empty-state">
        <i class="bi bi-inbox"></i>
        <h4>상품이 없습니다</h4>
        <p>검색 조건을 변경해보세요.</p>
    </div>

    <!-- Pagination -->
    <nav th:if="${coursePage.totalPages > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${coursePage.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/courses(page=${coursePage.number - 1}, categoryId=${selectedCategory?.id}, keyword=${keyword})}">
                    이전
                </a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, coursePage.totalPages - 1)}"
                th:classappend="${i == coursePage.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/courses(page=${i}, categoryId=${selectedCategory?.id}, keyword=${keyword})}"
                   th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${coursePage.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/courses(page=${coursePage.number + 1}, categoryId=${selectedCategory?.id}, keyword=${keyword})}">
                    다음
                </a>
            </li>
        </ul>
    </nav>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
