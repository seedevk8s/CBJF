<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header}"></head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="container my-5">
    <h1 class="mb-4">
        <i class="bi bi-book-half"></i> 내 수강 강의
    </h1>

    <div th:if="${enrollments.isEmpty()}" class="empty-state">
        <i class="bi bi-book"></i>
        <h4>수강 중인 강의가 없습니다</h4>
        <p>새로운 강의를 시작해보세요!</p>
        <a th:href="@{/courses}" class="btn btn-primary">
            <i class="bi bi-book"></i> 강의 둘러보기
        </a>
    </div>

    <div th:if="${!enrollments.isEmpty()}" class="row">
        <div class="col-md-6 mb-4" th:each="enrollment : ${enrollments}">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <h5 class="card-title" th:text="${enrollment.course.title}">강의 제목</h5>
                        <span th:if="${enrollment.status.name() == 'IN_PROGRESS'}" class="badge bg-primary">수강 중</span>
                        <span th:if="${enrollment.status.name() == 'COMPLETED'}" class="badge bg-success">완료</span>
                    </div>

                    <p class="card-text text-muted" th:text="${#strings.abbreviate(enrollment.course.description, 100)}">
                        강의 설명
                    </p>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between mb-1">
                            <small class="text-muted">진도율</small>
                            <small class="text-muted">
                                <strong th:text="${enrollment.progress}">0</strong>%
                            </small>
                        </div>
                        <div class="progress progress-bar-custom">
                            <div class="progress-bar" role="progressbar"
                                 th:style="'width: ' + ${enrollment.progress} + '%'"
                                 th:text="${enrollment.progress} + '%'">
                                0%
                            </div>
                        </div>
                    </div>

                    <div class="mb-2">
                        <small class="text-muted">
                            <i class="bi bi-calendar"></i>
                            수강 시작:
                            <span th:text="${#temporals.format(enrollment.enrolledAt, 'yyyy-MM-dd')}">2025-01-01</span>
                        </small>
                    </div>

                    <a th:href="@{/courses/{id}(id=${enrollment.course.id})}" class="btn btn-outline-primary btn-sm">
                        <i class="bi bi-play-circle"></i> 강의 보기
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/mypage}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> 마이페이지로
        </a>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
