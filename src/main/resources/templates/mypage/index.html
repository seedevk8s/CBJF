<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header}"></head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="container my-5">
    <h1 class="mb-4">
        <i class="bi bi-person-circle"></i> 마이페이지
    </h1>

    <div class="row">
        <!-- User Info Card -->
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <i class="bi bi-person-circle" style="font-size: 5rem; color: #0d6efd;"></i>
                    <h4 class="mt-3" th:text="${user.name}">사용자명</h4>
                    <p class="text-muted mb-2" th:text="${user.email}">이메일</p>
                    <span class="badge bg-primary" th:text="${user.role.name()}">역할</span>
                    <hr>
                    <div class="d-flex justify-content-around">
                        <div>
                            <h5 class="text-primary" th:text="${user.points}">0</h5>
                            <small class="text-muted">포인트</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Menu -->
        <div class="col-md-8">
            <div class="row">
                <div class="col-md-6 mb-4">
                    <a th:href="@{/mypage/enrollments}" class="text-decoration-none">
                        <div class="card shadow-sm h-100 hover-card">
                            <div class="card-body text-center">
                                <i class="bi bi-book-half" style="font-size: 3rem; color: #0d6efd;"></i>
                                <h5 class="mt-3">내 수강 강의</h5>
                                <p class="text-muted">수강 중인 강의 확인</p>
                            </div>
                        </div>
                    </a>
                </div>
                <div class="col-md-6 mb-4">
                    <a th:href="@{/mypage/orders}" class="text-decoration-none">
                        <div class="card shadow-sm h-100 hover-card">
                            <div class="card-body text-center">
                                <i class="bi bi-receipt" style="font-size: 3rem; color: #198754;"></i>
                                <h5 class="mt-3">주문 내역</h5>
                                <p class="text-muted">구매한 강의 확인</p>
                            </div>
                        </div>
                    </a>
                </div>
                <div class="col-md-6 mb-4">
                    <a th:href="@{/cart}" class="text-decoration-none">
                        <div class="card shadow-sm h-100 hover-card">
                            <div class="card-body text-center">
                                <i class="bi bi-cart3" style="font-size: 3rem; color: #ffc107;"></i>
                                <h5 class="mt-3">장바구니</h5>
                                <p class="text-muted">담아둔 강의 확인</p>
                            </div>
                        </div>
                    </a>
                </div>
                <div class="col-md-6 mb-4">
                    <a th:href="@{/community}" class="text-decoration-none">
                        <div class="card shadow-sm h-100 hover-card">
                            <div class="card-body text-center">
                                <i class="bi bi-people" style="font-size: 3rem; color: #dc3545;"></i>
                                <h5 class="mt-3">커뮤니티</h5>
                                <p class="text-muted">소통하고 질문하기</p>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
