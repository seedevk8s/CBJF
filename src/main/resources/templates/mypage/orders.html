<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header}"></head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="container my-5">
    <h1 class="mb-4">
        <i class="bi bi-receipt"></i> 주문 내역
    </h1>

    <div th:if="${orders.isEmpty()}" class="empty-state">
        <i class="bi bi-receipt"></i>
        <h4>주문 내역이 없습니다</h4>
        <p>상품을 구매해보세요!</p>
        <a th:href="@{/courses}" class="btn btn-primary">
            <i class="bi bi-shop"></i> 상품 둘러보기
        </a>
    </div>

    <div th:if="${!orders.isEmpty()}">
        <div class="card mb-3" th:each="order : ${orders}">
            <div class="card-header bg-white">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <strong>주문번호:</strong>
                        <span th:text="${order.orderNumber}">ORD202501011234</span>
                    </div>
                    <div>
                        <span th:if="${order.status.name() == 'PENDING'}" class="badge bg-warning">결제 대기</span>
                        <span th:if="${order.status.name() == 'PAID'}" class="badge bg-success">결제 완료</span>
                        <span th:if="${order.status.name() == 'CANCELLED'}" class="badge bg-danger">취소</span>
                    </div>
                </div>
                <small class="text-muted">
                    주문일: <span th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}">2025-01-01 12:00</span>
                </small>
            </div>
            <div class="card-body">
                <div th:each="item : ${order.items}" class="mb-2">
                    <div class="d-flex justify-content-between">
                        <div>
                            <strong th:text="${item.course.title}">상품명</strong>
                        </div>
                        <div>
                            <span th:text="${#numbers.formatInteger(item.price, 0, 'COMMA')} + '원'">100,000원</span>
                        </div>
                    </div>
                </div>
                <hr>
                <div class="d-flex justify-content-between">
                    <strong>총 결제 금액:</strong>
                    <h5 class="text-primary mb-0" th:text="${#numbers.formatInteger(order.totalPrice, 0, 'COMMA')} + '원'">
                        300,000원
                    </h5>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/mypage}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> 마이페이지로
        </a>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
