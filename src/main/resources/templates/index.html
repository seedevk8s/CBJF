<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header}"></head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>

<!-- Hero Section -->
<section class="hero-section">
    <div class="container text-center">
        <h1 class="hero-title">우리 강아지를 위한 특별한 선물</h1>
        <p class="hero-subtitle">프리미엄 반려견 용품을 한 곳에서 만나보세요</p>
        <a th:href="@{/courses}" class="btn btn-light btn-lg btn-custom">
            <i class="bi bi-heart-fill"></i> 상품 둘러보기
        </a>
    </div>
</section>

<div class="container mb-5">
    <!-- Features -->
    <div class="row mb-5">
        <div class="col-md-4">
            <div class="stats-card mb-3">
                <i class="bi bi-heart-fill" style="font-size: 3rem;"></i>
                <div class="stats-number">10,000+</div>
                <p>반려가족</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stats-card mb-3">
                <i class="bi bi-box-seam-fill" style="font-size: 3rem;"></i>
                <div class="stats-number">500+</div>
                <p>상품</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stats-card mb-3">
                <i class="bi bi-star-fill" style="font-size: 3rem;"></i>
                <div class="stats-number">4.8</div>
                <p>평점</p>
            </div>
        </div>
    </div>

    <!-- Popular Products -->
    <section class="mb-5">
        <h2 class="section-title">
            <i class="bi bi-fire"></i> 인기 상품
        </h2>
        <div class="row">
            <div class="col-md-4 course-card" th:each="course : ${popularCourses}">
                <div class="card shadow-sm">
                    <img th:src="${course.thumbnailUrl != null ? course.thumbnailUrl : '/images/course-thumbnail-400x200.svg'}"
                         class="card-img-top" th:alt="${course.title}"
                         onerror="this.onerror=null; this.src='/images/course-thumbnail-400x200.svg';">
                    <div class="card-body">
                        <span class="badge bg-primary mb-2" th:text="${course.category?.name}">카테고리</span>
                        <h5 class="card-title" th:text="${course.title}">상품명</h5>
                        <p class="card-text text-muted" th:text="${#strings.abbreviate(course.description, 80)}">
                            상품 설명
                        </p>
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="course-rating">
                                <i class="bi bi-star-fill"></i>
                                <span th:text="${#numbers.formatDecimal(course.rating, 1, 1)}">4.5</span>
                            </span>
                            <span class="text-muted">
                                <i class="bi bi-cart-check"></i>
                                <span th:text="${course.enrollmentCount}">100</span>개 판매
                            </span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="course-price" th:text="${#numbers.formatInteger(course.price, 0, 'COMMA')} + '원'">
                                100,000원
                            </span>
                            <a th:href="@{/courses/{id}(id=${course.id})}" class="btn btn-outline-primary btn-sm">
                                자세히 보기
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Latest Products -->
    <section class="mb-5">
        <h2 class="section-title">
            <i class="bi bi-clock-history"></i> 신상품
        </h2>
        <div class="row">
            <div class="col-md-4 course-card" th:each="course : ${latestCourses}">
                <div class="card shadow-sm">
                    <img th:src="${course.thumbnailUrl != null ? course.thumbnailUrl : '/images/course-thumbnail-400x200.svg'}"
                         class="card-img-top" th:alt="${course.title}"
                         onerror="this.onerror=null; this.src='/images/course-thumbnail-400x200.svg';">
                    <div class="card-body">
                        <span class="badge bg-success mb-2">NEW</span>
                        <span class="badge bg-primary mb-2 ms-1" th:text="${course.category?.name}">카테고리</span>
                        <h5 class="card-title" th:text="${course.title}">상품명</h5>
                        <p class="card-text text-muted" th:text="${#strings.abbreviate(course.description, 80)}">
                            상품 설명
                        </p>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="course-price" th:text="${#numbers.formatInteger(course.price, 0, 'COMMA')} + '원'">
                                100,000원
                            </span>
                            <a th:href="@{/courses/{id}(id=${course.id})}" class="btn btn-outline-primary btn-sm">
                                자세히 보기
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Notices -->
    <section th:if="${!notices.isEmpty()}" class="mb-5">
        <h2 class="section-title">
            <i class="bi bi-megaphone"></i> 공지사항
        </h2>
        <div class="card">
            <div class="list-group list-group-flush">
                <a th:each="notice : ${notices}"
                   th:href="@{/community/{id}(id=${notice.id})}"
                   class="list-group-item list-group-item-action">
                    <div class="d-flex w-100 justify-content-between">
                        <h6 class="mb-1">
                            <span class="badge bg-danger me-2">공지</span>
                            <span th:text="${notice.title}">공지사항 제목</span>
                        </h6>
                        <small th:text="${#temporals.format(notice.createdAt, 'yyyy-MM-dd')}">2025-01-01</small>
                    </div>
                </a>
            </div>
        </div>
    </section>

    <!-- Call to Action -->
    <section class="text-center bg-light p-5 rounded">
        <h3 class="mb-3">우리 아이에게 최고만을!</h3>
        <p class="text-muted mb-4">
            건강하고 행복한 반려생활을 위한 프리미엄 용품<br>
            사료, 간식, 장난감, 용품까지 모든 것이 한 곳에!
        </p>
        <a th:href="@{/courses}" class="btn btn-primary btn-lg btn-custom me-2">
            <i class="bi bi-cart"></i> 쇼핑하기
        </a>
        <a th:href="@{/community}" class="btn btn-outline-primary btn-lg btn-custom">
            <i class="bi bi-chat-dots"></i> 커뮤니티
        </a>
    </section>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
