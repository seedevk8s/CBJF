<svg xmlns="http://www.w3.org/2000/svg" width="200" height="120" viewBox="0 0 200 120">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffa07a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6347;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="120" fill="url(#grad3)"/>

  <!-- Dog icon -->
  <g transform="translate(80, 30)">
    <!-- Dog head -->
    <ellipse cx="20" cy="23" rx="15" ry="18" fill="#ffffff" opacity="0.95"/>
    <!-- Left ear -->
    <ellipse cx="10" cy="15" rx="6" ry="13" fill="#ffffff" opacity="0.9" transform="rotate(-20 10 15)"/>
    <!-- Right ear -->
    <ellipse cx="30" cy="15" rx="6" ry="13" fill="#ffffff" opacity="0.9" transform="rotate(20 30 15)"/>
    <!-- Eyes -->
    <circle cx="15" cy="20" r="2" fill="#333333"/>
    <circle cx="25" cy="20" r="2" fill="#333333"/>
    <!-- Nose -->
    <ellipse cx="20" cy="26" rx="3" ry="2.5" fill="#333333"/>
    <!-- Mouth -->
    <path d="M 20 26 Q 17 29 15 28" stroke="#333333" stroke-width="1" fill="none"/>
    <path d="M 20 26 Q 23 29 25 28" stroke="#333333" stroke-width="1" fill="none"/>
    <!-- Tongue -->
    <ellipse cx="20" cy="31" rx="2" ry="3" fill="#ff69b4" opacity="0.8"/>
  </g>

  <text x="50%" y="85%" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="600">강아지 상품</text>
</svg>
