<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#grad2)"/>

  <!-- Book icon -->
  <g transform="translate(175, 70)">
    <rect x="5" y="0" width="40" height="50" fill="#ffffff" opacity="0.9" rx="3"/>
    <line x1="25" y1="0" x2="25" y2="50" stroke="#667eea" stroke-width="2"/>
    <line x1="10" y1="15" x2="20" y2="15" stroke="#667eea" stroke-width="1.5"/>
    <line x1="30" y1="15" x2="40" y2="15" stroke="#667eea" stroke-width="1.5"/>
    <line x1="10" y1="25" x2="20" y2="25" stroke="#667eea" stroke-width="1.5"/>
    <line x1="30" y1="25" x2="40" y2="25" stroke="#667eea" stroke-width="1.5"/>
    <line x1="10" y1="35" x2="20" y2="35" stroke="#667eea" stroke-width="1.5"/>
    <line x1="30" y1="35" x2="40" y2="35" stroke="#667eea" stroke-width="1.5"/>
  </g>

  <text x="50%" y="80%" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="600">강의 썸네일</text>
</svg>
