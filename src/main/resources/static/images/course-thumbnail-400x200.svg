<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffa07a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6347;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#grad2)"/>

  <!-- Dog icon -->
  <g transform="translate(160, 50)">
    <!-- Dog head -->
    <ellipse cx="40" cy="45" rx="30" ry="35" fill="#ffffff" opacity="0.95"/>
    <!-- Left ear -->
    <ellipse cx="20" cy="30" rx="12" ry="25" fill="#ffffff" opacity="0.9" transform="rotate(-20 20 30)"/>
    <!-- Right ear -->
    <ellipse cx="60" cy="30" rx="12" ry="25" fill="#ffffff" opacity="0.9" transform="rotate(20 60 30)"/>
    <!-- Eyes -->
    <circle cx="30" cy="40" r="4" fill="#333333"/>
    <circle cx="50" cy="40" r="4" fill="#333333"/>
    <!-- Nose -->
    <ellipse cx="40" cy="52" rx="6" ry="5" fill="#333333"/>
    <!-- Mouth -->
    <path d="M 40 52 Q 35 58 30 56" stroke="#333333" stroke-width="2" fill="none"/>
    <path d="M 40 52 Q 45 58 50 56" stroke="#333333" stroke-width="2" fill="none"/>
    <!-- Tongue -->
    <ellipse cx="40" cy="62" rx="4" ry="6" fill="#ff69b4" opacity="0.8"/>
  </g>

  <text x="50%" y="85%" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="600">강아지 상품</text>
</svg>
