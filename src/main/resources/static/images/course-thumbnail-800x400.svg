<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#grad1)"/>

  <!-- Book icon -->
  <g transform="translate(350, 150)">
    <rect x="10" y="0" width="80" height="100" fill="#ffffff" opacity="0.9" rx="5"/>
    <line x1="50" y1="0" x2="50" y2="100" stroke="#667eea" stroke-width="3"/>
    <line x1="20" y1="30" x2="40" y2="30" stroke="#667eea" stroke-width="2"/>
    <line x1="60" y1="30" x2="80" y2="30" stroke="#667eea" stroke-width="2"/>
    <line x1="20" y1="50" x2="40" y2="50" stroke="#667eea" stroke-width="2"/>
    <line x1="60" y1="50" x2="80" y2="50" stroke="#667eea" stroke-width="2"/>
    <line x1="20" y1="70" x2="40" y2="70" stroke="#667eea" stroke-width="2"/>
    <line x1="60" y1="70" x2="80" y2="70" stroke="#667eea" stroke-width="2"/>
  </g>

  <text x="50%" y="75%" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="600">온라인 강의</text>
</svg>
